<!doctype html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BP 拍片配對器</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@400;500;700&family=Noto+Serif+HK:wght@700;900&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one column — pick industry (big tiles) → video ideas → JVM offer. Built for business owners reading on a phone. */
:root{
  --bg:#f3f5f7; --paper:#ffffff; --ink:#15202b; --muted:#5d6b78; --line:#d9dfe5;
  --accent:#c8102e; --accent-soft:#fbe7ea; --slate:#1d2b38; --slate-fg:#f3f5f7; --chip:#eaeef2;
  --display:"Noto Serif HK","Songti TC",serif;
  --body:"Noto Sans HK","PingFang HK","Microsoft JhengHei",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f151b; --paper:#172029; --ink:#e7ecf0; --muted:#94a3b0; --line:#2a3743;
  --accent:#ff4d63; --accent-soft:#3a1a20; --slate:#e7ecf0; --slate-fg:#0f151b; --chip:#22303c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f151b; --paper:#172029; --ink:#e7ecf0; --muted:#94a3b0; --line:#2a3743;
  --accent:#ff4d63; --accent-soft:#3a1a20; --slate:#e7ecf0; --slate-fg:#0f151b; --chip:#22303c; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.7}
[hidden]{display:none!important}
.wrap{max-width:860px;margin:0 auto;padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:28px}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.12em;color:var(--muted);display:flex;align-items:center;gap:8px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--accent);display:inline-block;animation:blink 1.6s infinite}
@keyframes blink{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.dot{animation:none}}
h1{font-family:var(--display);font-weight:900;font-size:clamp(30px,6vw,46px);line-height:1.15;margin:6px 0 8px;text-wrap:balance}
h2{font-family:var(--display);font-size:clamp(20px,3.6vw,26px);margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:0;max-width:56ch}
.step{font-family:var(--mono);font-size:12px;color:var(--accent);font-weight:700;letter-spacing:.08em}
.head{display:flex;flex-direction:column;gap:4px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.tiles button{font:inherit;font-weight:700;font-size:15px;text-align:left;background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:12px;cursor:pointer;min-height:52px;line-height:1.35}
.tiles button[aria-pressed="true"]{background:var(--slate);color:var(--slate-fg);border-color:var(--slate)}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.namebox{display:flex;flex-direction:column;gap:6px;max-width:420px}
.namebox label{font-size:14px;font-weight:700}
input[type=text]{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:18px}
.f{display:flex;flex-direction:column;gap:6px;min-width:0}
.f label,.f .lbl{font-size:14px;font-weight:700}
.f small{font-weight:400;color:var(--muted)}
select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%}
.form input[type=text]{background:var(--bg)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label{font-weight:500!important;font-size:14px!important;padding:6px 12px;border:1px solid var(--line);border-radius:999px;cursor:pointer;background:var(--bg)}
.seg input:checked+label{background:var(--slate);color:var(--slate-fg);border-color:var(--slate)}
.seg input:focus-visible+label{outline:2px solid var(--accent);outline-offset:2px}
.advs{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.adv{border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:4px}
.adv b{font-size:16px}
.adv .from{font-family:var(--mono);font-size:11px;color:var(--accent);letter-spacing:.06em}
.tips{margin:0;padding-left:20px;font-size:15px}
.idea .src{font-size:12px;color:var(--muted)}
.btn.go{width:100%;max-width:420px;font-size:18px;padding:16px;align-self:flex-start}
.btn.go:disabled{opacity:.7;cursor:progress}
.reveal{animation:rise .5s ease-out}
@keyframes rise{from{opacity:.2;transform:translateY(12px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.reveal{animation:none}}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chiphead{font-family:var(--mono);font-size:12px;color:var(--accent);font-weight:700;letter-spacing:.06em;margin-right:4px}
.chip{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;padding:6px 12px;line-height:1.4}
.chip b{font-size:14px}
.chip small{font-size:11px;color:var(--muted)}
.blank{border-bottom:2px dashed var(--accent);color:var(--accent);padding:0 2px;font-weight:700}
.idea .top{align-items:center}
.idea .row{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.btn.wa{padding:8px 14px;font-size:14px}
.idea details ol{font-size:14px}
details.fold{border:1px solid var(--line);border-radius:10px;padding:12px 14px}
details.fold>summary{font-weight:700;font-size:16px;color:var(--ink)}
details.fold[open]>summary{margin-bottom:10px}
.plot{background:var(--bg);border-radius:8px;padding:10px 12px;font-size:14px;display:flex;flex-direction:column;gap:4px}
.plot b{font-size:12px;color:var(--muted);font-weight:500;margin-right:8px}
.plot ol{margin:0;padding-left:20px}
.plot li::marker{color:var(--accent);font-weight:700}
.tablewrap{overflow-x:auto}
table.acct{border-collapse:collapse;width:100%;min-width:560px;font-size:14px}
.acct th,.acct td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.acct th{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.06em}
.acct td.num{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.acct tr.hit{background:var(--accent-soft)}
.acct a{color:var(--ink);font-weight:700}
.pill{font-family:var(--mono);font-size:10px;background:var(--accent);color:#fff;border-radius:4px;padding:1px 5px}
select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:22px;display:flex;flex-direction:column;gap:16px;min-width:0}
.why{background:var(--slate);color:var(--slate-fg);border-radius:10px;padding:16px 18px;font-weight:700;font-size:17px}
.why small{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.1em;opacity:.7;font-weight:500}
.ideas{display:flex;flex-direction:column;gap:12px}
.idea{border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:8px}
.idea .top{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 12px}
.idea .no{font-family:var(--mono);font-weight:700;color:var(--accent)}
.idea .name{font-weight:700;font-size:18px}
.tag{font-family:var(--mono);font-size:12px;background:var(--chip);border-radius:4px;padding:2px 6px}
.hook{border-left:3px solid var(--accent);padding-left:12px;font-size:16px}
.hook b{display:block;font-size:12px;color:var(--muted);font-weight:500}
details{font-size:15px}
summary{cursor:pointer;color:var(--muted);font-size:14px}
details ol{margin:6px 0 0;padding-left:20px}
.more{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.more div{background:var(--bg);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:2px;font-size:14px}
.more b{font-size:15px}
.muted{color:var(--muted)}
.note{font-size:14px;color:var(--muted);margin:0}
.warn{background:var(--accent-soft);border-radius:8px;padding:12px 16px;font-size:15px}
.warn ul{margin:4px 0 0;padding-left:20px}
.jvm{background:var(--slate);color:var(--slate-fg);border-color:var(--slate)}
.jvm .muted,.jvm .note{color:inherit;opacity:.75}
.offers{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.offer{background:var(--paper);color:var(--ink);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.offer .oname{font-weight:700;font-size:17px}
.price{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.price b{font-family:var(--mono);font-size:28px;color:var(--accent)}
.price s{color:var(--muted);font-size:14px}
.offer ul{margin:0;padding-left:20px;font-size:15px}
.offer .terms{font-size:13px;color:var(--muted);margin:0}
.contact{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{font:inherit;font-weight:700;border:0;border-radius:8px;padding:12px 18px;cursor:pointer;background:var(--accent);color:#fff;text-decoration:none;display:inline-block}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.jvm .btn.ghost{color:inherit;border-color:currentColor}
.sel{user-select:all;font-family:var(--mono);font-size:14px;border:1px solid currentColor;border-radius:8px;padding:10px 12px;overflow-wrap:anywhere;opacity:.9}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--slate);color:var(--slate-fg);padding:10px 16px;border-radius:8px;font-size:14px}
footer{color:var(--muted);font-size:12px;font-family:var(--mono);line-height:1.8}
</style>
</head>
<body>
<div class="wrap">
  <header class="head">
    <div class="eyebrow"><span class="dot" aria-hidden="true"></span>JVM 內容行銷 · BP 會員專屬</div>
    <h1>你盤生意，應該拍乜片？</h1>
    <p class="sub">揀行業、講少少你嘅背景，即刻配對出你拍片嘅優勢同度身題材。拍攝同剪輯交俾 JVM 就得。</p>
  </header>

  <section class="head" style="gap:12px">
    <span class="step">第 1 步</span>
    <h2>揀你嘅行業</h2>
    <div class="tiles" id="tiles" role="group" aria-label="行業"></div>
    <span class="step" style="margin-top:12px">第 2 步</span>
    <h2>講少少你盤生意</h2>
    <p class="note">已填咗示例，請改成你自己。</p>
    <div class="form">
      <div class="f"><label for="biz">公司 / 品牌名稱</label><input type="text" id="biz" value="陳記茶餐廳"></div>
      <div class="f"><label for="dist">舖頭喺邊區？</label><select id="dist"></select></div>
      <div class="f"><span class="lbl">開咗幾耐？</span><div class="seg" id="yrs"></div></div>
      <div class="f"><span class="lbl">你有咩特色？<small>（可以揀多個）</small></span><div class="seg" id="traits"></div></div>
      <div class="f"><span class="lbl">主要客人係邊啲？<small>（可以揀多個）</small></span><div class="seg" id="cust"></div></div>
      <div class="f"><span class="lbl">老闆肯唔肯出鏡？</span><div class="seg" id="face"></div></div>
    </div>
    <button class="btn go" type="button" id="go">開始配對</button>
  </section>

  <section class="panel" id="result" aria-live="polite" hidden></section>

  <section class="panel jvm" id="jvm" hidden></section>

  <footer>由 JVM 內容行銷提供｜WhatsApp 9634 7605｜Justvibingmedia8@gmail.com｜IG @justvibing_media<br>題材按一般行業做法整理，唔代表保證成效。</footer>
</div>
<div class="toast" id="toast" hidden></div>

<script>
const IND = {
  food:{n:"餐飲 / 食肆",pain:"客人未試過唔會入嚟，要令佢未食已經想食。",
    pillars:[["招牌菜製作過程","睇住整先最吸引"],["食評 / 客人反應","第三方講好過自己講"],["老闆 / 師傅故事","有人情味先記得"],["優惠 / 新品","俾一個今日就嚟嘅理由"]],
    formats:[{n:"製作過程 ASMR",len:"15–25秒",hook:"「呢個［招牌菜］，我哋每朝［幾點］開始整。」",st:["0–2秒：成品特寫 + 牛油溶落去","3–15秒：搓麵、焗爐、出爐三個快鏡","16–20秒：咬落去嘅聲同表情","結尾：地址字幕 + 營業時間"]},
      {n:"街訪試食",len:"30–45秒",hook:"「俾 10 個路人試，有幾多個話好食？」",st:["開場問題字幕","3–5個真實反應快剪","評分數字疊字","結尾：店名 + 優惠碼"]},
      {n:"老闆一分鐘",len:"45–60秒",hook:"「做咗［X］年，我最怕客人問呢一句⋯」",st:["老闆對鏡講一個真實小故事","穿插舖頭舊相 / 日常畫面","收尾帶出招牌菜","CTA：留言講你最鍾意食咩"]}],
    shots:[["大特寫","招牌菜成品、蒸氣、醬汁流動",3],["特寫","師傅手部操作",4],["中景","師傅全身工作",3],["空鏡","舖面招牌、排隊人龍",2],["中近景","客人食第一啖反應",3],["俯拍","成枱餸 flat lay",2]],
    kpi:["收藏數","分享數","「點去」留言","到店提及影片人數"],
    avoid:["食物要即整即拍，熱辣辣先有蒸氣","避免拍到其他客人樣貌，要先問准"],
    cta:"（例）今日嚟講「睇片嚟」有小禮物"},
  beauty:{n:"美容 / 美髮",pain:"效果睇得見先信，客人最驚「做完唔似相」。",
    pillars:[["Before / After","直接證明效果"],["過程 & 技術","建立專業感"],["護理小知識","教育型內容易收藏"],["客人見證","減低第一次嘅擔心"]],
    formats:[{n:"同一動作 Before↔After",len:"10–20秒",hook:"「撥一撥頭髮，就由呢個變呢個。」",st:["Before：客人撥頭髮 / 轉頭","跟住音樂 beat 切去 After 同一動作","慢鏡 360° 展示","字幕：髮型名稱 + 所需時間"]},
      {n:"髮型師講解",len:"30–45秒",hook:"「電髮之前，你一定要問髮型師呢一條問題。」",st:["一個常見錯誤","示範正確做法","對比效果","CTA：留言「預約」"]},
      {n:"客人真心話",len:"20–30秒",hook:"「第一次嚟，我其實好驚。」",st:["客人講做之前嘅擔心","做緊嘅過程快剪","完成後嘅反應","店名 + 預約方法"]}],
    shots:[["中近景","Before 正面 + 側面",3],["特寫","工具、剪刀、染膏調色",2],["大特寫","髮質 / 皮膚紋理",2],["中景","師傅同客人互動",3],["慢鏡","After 撥頭髮 / 轉身",4],["特寫","客人照鏡反應",2]],
    kpi:["收藏數","私訊查詢數","預約轉化","完播率"],
    avoid:["Before 同 After 要同一燈光、同一角度，否則冇說服力","醫學美容效果唔可以誇大，要符合商品說明條例"],
    cta:"（例）私訊「預約」查詢首次優惠"},
  retail:{n:"零售 / 電商",pain:"網上睇唔到實物，要用影片代替摸到、試到。",
    pillars:[["開箱 / 實物展示","解決「實物係點」"],["用法教學","令人想像自己用緊"],["比較 / 推介","幫客人做決定"],["限時優惠","製造即時購買理由"]],
    formats:[{n:"3秒開箱",len:"15–20秒",hook:"「呢個係我今年最後悔冇早啲買嘅嘢。」",st:["產品最吸引一刻先出","開箱過程快剪","三個賣點各 2 秒","價錢 + 購買連結"]},
      {n:"一物多用",len:"20–30秒",hook:"「一個［產品］，可以有［X］種用法。」",st:["數字倒數結構","每種用法一個場景","最後一種最驚喜","CTA：連結喺 bio"]},
      {n:"店員推介",len:"30–45秒",hook:"「如果你預算［$］，我會揀呢三樣。」",st:["設定預算 / 情境","三件產品逐件講","各自適合邊類人","邀請到店 / 網購"]}],
    shots:[["大特寫","產品質感、細節、Logo",2],["手部","開箱、拎起、使用",3],["中景","模特兒 / 店員使用",3],["空鏡","店舖陳列",2],["對比","產品大小 vs 日常物件",2],["定格","價錢牌 / 優惠",2]],
    kpi:["連結點擊率","加入購物車","優惠碼使用次數","每條片帶來營業額"],
    avoid:["價錢同優惠期要寫清楚，避免誤導","唔好用未授權嘅流行音樂做廣告片"],
    cta:"（例）輸入優惠碼享會員優惠"},
  property:{n:"地產代理",pain:"盤源人人都有，客人揀嘅係「信唔信你」。",
    pillars:[["睇樓 Room Tour","主力引客"],["區內生活資訊","建立地區專家形象"],["市場 / 按揭知識","專業度"],["成交故事","社會證明"]],
    formats:[{n:"60秒睇樓團",len:"45–60秒",hook:"「［預算］喺［地區］，買到啲咩？」",st:["開場：價錢 + 地區大字","由門口一鏡行入去","重點：景觀、間隔、採光","結尾：盤號 + 聯絡"]},
      {n:"地區一分鐘",len:"30–45秒",hook:"「住［地區］［X］年，我會話你知 3 樣嘢。」",st:["地區空鏡開場","三個生活資訊（交通、食肆、學校）","代理對鏡總結","CTA：留言想睇邊區"]},
      {n:"按揭 Q&A",len:"30–45秒",hook:"「首期唔夠？你可以先了解呢幾個選擇。」",st:["一個常見問題","簡單計數字卡","提醒風險","邀請私訊計算"]}],
    shots:[["穩定器一鏡","入門到客廳",8],["廣角","每個房間",3],["窗外","景觀",3],["特寫","廚廁設備",2],["空鏡","屋苑會所、附近街道",3],["中景","代理對鏡講解",5]],
    kpi:["私訊查詢","睇樓預約","粉絲中本區比例","完播率"],
    avoid:["必須遵守地產代理監管局廣告指引，列明牌照號碼","業主單位要先取得同意先拍攝"],
    cta:"私訊「睇樓」安排睇樓"},

    re:["盲測：人手定系統快？","「人手做同系統做，你估差幾多？」","兩個用家","兩人比賽做同一件事 → 旁人估邊個贏 → 公佈時間差距"],
    day:["窺探{biz}內部嘅一日","「窺探吓{biz}內部嘅一日。」","團隊成員","朝早開會、鬥嘴 → 解決客人問題 → 收工一齊打機"]},
  reno:{
    sk:["業主：「預算唔多，但我要好靚」","「預算唔多，但我要好靚。」","業主、設計師","業主拎住雜誌相講要求 → 設計師逐樣計數，計數機越按越大 → 結尾設計師拎出平靚正方案，業主即刻簽"],
    ch:["［預算］可唔可以裝到成間屋？","「［預算］，可唔可以裝到成間屋？」","設計師、業主","設定預算挑戰 → 施工快剪、逐樣計數 → 完工公佈總數，業主反應"],
    pov:["POV：裝到一半，業主話要改","「POV：裝到一半，業主話要改設計⋯」","業主、師傅","業主笑住行入嚟 → 講「我老婆話要改」→ 師傅手上個鎚慢慢放低"],
    re:["業主第一次入返屋嘅真實反應","「業主第一次入返屋，係咩反應？」","業主一家、設計師","蒙眼帶業主入屋 → 除眼罩一刻 → 逐個房間嘅驚喜反應"],
    day:["裝修師傅開工嘅一日","「朝早［幾點］開工，裝修師傅嘅一日。」","師傅、業主","朝早開工 → 突發狀況、即場解決 → 收工業主送飲品多謝"]}
};
/* 特色決定公式優先次序 */
const TRAIT_ORDER={value:"ch",story:"day",heritage:"day",photo:"re",team:"sk",unique:"re",premium:"re",handmade:"day"};
/* 對標帳號（2026-10-19 核實） */
const ACCTS=[
  {h:"minibangkok",n:"小曼谷 Mini Bangkok",r:"香港",ind:["food"],f:"6,511",top:"22.4萬",note:"餐廳小劇場：拍拖、AA 制、請客"},
  {h:"hang.hairstylist",n:"Hang｜尖沙咀髮型師",r:"香港",ind:["beauty"],f:"350",top:"66.3萬",note:"路人挑戰、熱門梗"},
  {h:"weefedia.marketing",n:"weefedia",r:"香港",ind:[],f:"780",top:"66.3萬",note:"Gen Z 中小企行銷公司，幫客拍小劇場同挑戰"},
  {h:"yia0701",n:"小雅｜台南短影音行銷",r:"台灣",ind:["food","retail","travel"],f:"7,997",top:"27.5萬",note:"主持人探店、好奇問題、真實反應"},
  {h:"xway.marketing",n:"穿透行銷",r:"台灣",ind:["tech","pro"],f:"7,712",top:"4.7萬",note:"公司幕後、內訓窺探"},
  {h:"ryanserhant",n:"Ryan Serhant",r:"美國",ind:["property","finance","pro"],f:"300萬",top:"2,538萬",note:"地產經紀：辦公室小劇場、老闆一日"},
  {h:"vicblends",n:"VicBlends",r:"美國",ind:["beauty"],f:"500萬",top:"928.3萬",note:"理髮師個人品牌"}
];

/* 睇同行：Instagram hashtag（即時、唔會過時） */
const TAGS={food:["香港美食","香港茶餐廳"],beauty:["香港髮型師","香港美容"],retail:["香港小店","香港網店"],property:["香港地產","香港睇樓"],
  finance:["香港理財","香港保險"],edu:["香港補習","香港興趣班"],health:["香港物理治療","香港痛症"],fitness:["香港健身","香港私人教練"],
  pro:["香港中小企","香港創業"],mfg:["香港製造","madeinhongkong"],travel:["香港酒店","香港staycation"],tech:["香港初創","香港科技"],reno:["香港裝修","香港室內設計"]};
/* 對標帳號：只放已核實（帳號存在、仲有更新）嘅帳號。格式：{h:"handle",why:"值得參考嘅地方"} */
const REFS={};

const $=s=>document.querySelector(s);
const bl=s=>esc(s).replace(/［(.*?)］/g,'<span class="blank">$1</span>');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let cur="food";
function fillSeg(el,name,obj,checked,multi){el.innerHTML=Object.entries(obj).map(([k,v])=>`<input type="${multi?"checkbox":"radio"}" name="${name}" id="${name}-${k}" value="${k}"${checked.includes(k)?" checked":""}><label for="${name}-${k}">${v.n}</label>`).join("")}
$("#dist").innerHTML=DIST.map(d=>`<option${d==="觀塘"?" selected":""}>${d}</option>`).join("");
fillSeg($("#yrs"),"yrs",YRS,["y3"]);fillSeg($("#traits"),"traits",TRAITS,["heritage","handmade"],true);
fillSeg($("#cust"),"cust",CUST,["office"],true);fillSeg($("#face"),"face",FACE,["yes"]);

$("#tiles").innerHTML=Object.entries(IND).map(([k,v])=>`<button type="button" data-k="${k}" aria-pressed="${k===cur}">${v.n}</button>`).join("");
$("#tiles").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;cur=b.dataset.k;
  document.querySelectorAll("#tiles button").forEach(x=>x.setAttribute("aria-pressed",x===b));render()});
document.querySelector(".form").addEventListener("input",render);
document.querySelector(".form").addEventListener("change",render);
$("#go").addEventListener("click",()=>{
  const go=$("#go"),reduce=matchMedia("(prefers-reduced-motion:reduce)").matches;
  go.disabled=true;go.textContent="配對緊⋯";
  setTimeout(()=>{render();$("#result").hidden=false;$("#jvm").hidden=false;
    $("#result").classList.remove("reveal");void $("#result").offsetWidth;$("#result").classList.add("reveal");
    go.disabled=false;go.textContent="重新配對";
    $("#result").scrollIntoView({behavior:reduce?"auto":"smooth",block:"start"})},reduce?0:700);
});

function readBg(){
  const checked=n=>[...document.querySelectorAll(`input[name=${n}]:checked`)].map(i=>i.value);
  const dist=$("#dist").value;
  return{biz:$("#biz").value.trim()||"你間舖",dist,online:dist.startsWith("全港"),yrs:checked("yrs")[0]||"y1",traits:checked("traits"),cust:checked("cust"),face:checked("face")[0]||"yes"};
}
const fill=(t,b)=>t.replaceAll("{biz}",b.biz).replaceAll("{dist}",b.online?"香港":b.dist).replaceAll("{yrs}",YRS[b.yrs].t).replaceAll("［地區］",b.online?"［地區］":b.dist);

/* 配對：由背景推出優勢，再由優勢出題材。每項都寫明係由邊個答案嚟 */
function match(b){
  const advs=[],topics=[];
  let traits=[...b.traits];
  if(b.yrs==="y3"&&!traits.includes("heritage"))traits.unshift("heritage");
  traits.forEach(k=>{const t=TRAITS[k];advs.push({from:t.n,adv:t.adv,why:t.why});topics.push({n:fill(t.topic,b),hook:fill(t.hook,b),src:`因為你揀咗「${t.n}」`})});
  if(b.yrs==="y0"){advs.push({from:"開業一年內",adv:"新店有成長故事",why:"觀眾鍾意由第一日跟住你，見證間舖成長。"});
    topics.push({n:"開業日記",hook:"「開舖第［X］日，今日發生咗⋯」",src:"因為你開業一年內"})}
  if(!b.online){advs.push({from:b.dist,adv:`${b.dist}就係你嘅流量入口`,why:`住喺或者喺${b.dist}返工嘅人，最有機會變成你嘅客。片入面講明地區，同區嘅人更易見到。`});
    topics.push({n:`${b.dist}${SHORT[cur]}推介：${b.biz}`,hook:`「喺${b.dist}${b.cust.includes("office")?"返工":"住"}，你一定要知呢間。」`,src:`因為你喺${b.dist}`})}
  if(b.face==="yes")advs.push({from:"老闆肯出鏡",adv:"老闆親自出鏡",why:"同一個人固定出現，觀眾會慢慢認得你、信你。"});
  return{advs,topics:topics.slice(0,3)};
}

function render(){
  const I=IND[cur],b=readBg(),M=match(b),S=SCEN[cur];
  // 公式次序：由特色決定先後，其餘跟數據強弱
  let order=["sk","ch","pov","re","day"];
  const pri=[...new Set(b.traits.map(t=>TRAIT_ORDER[t]).filter(Boolean))];
  order=[...pri,...order.filter(k=>!pri.includes(k))];
  const all=order.map(k=>({k,f:FORMULAS[k],n:fill(S[k][0],b),hook:fill(S[k][1],b),cast:S[k][2],plot:fill(S[k][3],b),why:pri.includes(k)?`配合你嘅特色「${b.traits.filter(t=>TRAIT_ORDER[t]===k).map(t=>TRAITS[t].n).join("、")}」`:""}));
  const tags=[...(b.online?[]:[b.dist+SHORT[cur]]),...TAGS[cur]];
  const accts=[...ACCTS.filter(a=>a.ind.includes(cur)),...ACCTS.filter(a=>!a.ind.includes(cur))];
  const waBase=`你好，我係 BP 會員，${b.biz}（${b.dist}，${I.n}）。`;
  const hasBlank=all.some(t=>/［/.test(t.n+t.hook+t.plot));
  $("#result").innerHTML=`
    <span class="step">配對結果</span>
    <h2>${esc(b.biz)}｜${esc(b.dist)}｜${I.n}</h2>
    <div class="why"><small>你行業嘅重點</small>${I.pain}</div>
    <div class="chips" aria-label="你拍片嘅優勢"><span class="chiphead">你嘅優勢</span>${M.advs.map(a=>`<span class="chip" title="${esc(a.why)}"><b>${esc(a.adv)}</b><small>來自：${esc(a.from)}</small></span>`).join("")||`<span class="note">揀多啲特色，配對會更準。</span>`}</div>
    <h2 style="font-size:19px">為 ${esc(b.biz)} 度身嘅 5 條片</h2>
    <p class="note">每條都係有角色、有互動嘅劇情，公式由真實爆片數據歸納。${hasBlank?'<span class="blank">虛線位</span>要填返你自己嘅真實資料。':""}</p>
    <div class="ideas">${all.map((t,i)=>`
      <div class="idea">
        <div class="top"><span class="no">片 ${i+1}</span><span class="tag">${t.f.n}</span>${t.why?`<span class="src" style="color:var(--accent)">${esc(t.why)}</span>`:""}</div>
        <span class="name">${bl(t.n)}</span>
        <div class="hook"><b>開頭第一句</b>${bl(t.hook)}</div>
        <div class="plot"><span><b>角色</b>${esc(t.cast)}</span><ol>${t.plot.split(/\s*→\s*/).map(x=>`<li>${bl(x)}</li>`).join("")}</ol></div>
        <div class="row">
          <a class="btn wa" href="https://wa.me/${JVM.wa}?text=${encodeURIComponent(waBase+`想 JVM 幫我拍呢條：「${t.n}」`)}" target="_blank" rel="noopener">想拍呢條？WhatsApp JVM</a>
          <details><summary>點拍 + 數據參考</summary><ol>${t.f.how.map(s=>`<li>${s}</li>`).join("")}</ol><p class="src">數據參考：${t.f.ev}</p></details>
        </div>
      </div>`).join("")}</div>
    ${b.face==="no"?`<p class="warn">老闆唔出鏡都拍得：小劇場同挑戰可以由 JVM 安排演員或者 KOL 出鏡。</p>`:""}
    <details class="fold"><summary>對標帳號（真實數據）</summary>
      <div class="tablewrap"><table class="acct"><thead><tr><th>帳號</th><th>地區</th><th>粉絲</th><th>最高 Reels</th><th>值得學</th></tr></thead><tbody>
        ${accts.map(a=>`<tr class="${a.ind.includes(cur)?"hit":""}"><td><a href="https://www.instagram.com/${a.h}/" target="_blank" rel="noopener">@${a.h}</a>${a.ind.includes(cur)?' <span class="pill">同行</span>':""}</td><td>${a.r}</td><td class="num">${a.f}</td><td class="num">${a.top}</td><td>${a.note}</td></tr>`).join("")}
      </tbody></table></div>
      <p class="note">數據喺 2026 年 10 月 19 日讀取。hang.hairstylist 得 350 粉絲，都有一條片 66.3萬 view：爆唔爆睇內容，唔睇粉絲數。</p>
      <div class="contact">${tags.map(t=>`<a class="btn ghost" href="https://www.instagram.com/explore/tags/${encodeURIComponent(t)}/" target="_blank" rel="noopener">#${esc(t)}</a>`).join("")}</div>
    </details>
    ${b.cust.length?`<details class="fold"><summary>針對你嘅客人</summary><ul class="tips">${b.cust.map(c=>`<li><b>${CUST[c].n}：</b>${esc(fill(CUST[c].tip,b))}</li>`).join("")}</ul></details>`:""}
    <details class="fold"><summary>要小心</summary>
      <ul class="tips">${I.avoid.map(a=>`<li>${a}</li>`).join("")}<li>唔好淨係拍優惠海報同純產品展示。${ANTI.replace(/^[^：]*：/,"")}</li></ul>
    </details>
    <div><button class="btn ghost" type="button" id="copy">複製結果，WhatsApp 俾自己</button></div>`;
  $("#copy").onclick=()=>copy(b,M,all);
  renderJVM(b);
}

function offer(o){return`<div class="offer">
  <div class="oname">${o.n}</div>
  <div class="price"><b>${o.price}</b><span>／${o.unit}</span>${o.orig?`<s>原價 ${o.orig}</s>`:""}</div>
  <ul>${o.items.map(i=>`<li>${i}</li>`).join("")}</ul>
  ${o.terms?`<p class="terms">${o.terms}</p>`:""}
</div>`}

function renderJVM(b){
  b=b||readBg();const I=IND[cur];
  const msg=encodeURIComponent(`你好，我係 BP 會員，${b.biz}（${b.dist}，${I.n}），用咗拍片題材配對器，想了解 JVM 拍片服務。`);
  const c=JVM.cases[cur];
  $("#jvm").innerHTML=`
    <span class="step" style="color:inherit;opacity:.75">BP 會員專屬</span>
    <h2>上面 5 條片，交俾 JVM 拍</h2>
    <p class="muted" style="margin:0">JVM 可以上門幫你拍、幫你剪，再教你點樣將睇片嘅人變成查詢。${c?`JVM 做過同類行業：${c}。`:""}</p>
    <div class="offers">${offer(JVM.diag)}${offer(JVM.pilot)}</div>
    <div class="contact">
      <a class="btn" href="https://wa.me/${JVM.wa}?text=${msg}" target="_blank" rel="noopener">WhatsApp JVM：${JVM.waShow}</a>
      <span class="sel">${JVM.email}</span><span class="sel">IG ${JVM.ig}</span>
    </div>
    <p class="note">聯絡時請講明你係 BP 會員。${JVM.founder}｜價錢及名額以 JVM 最新合約為準。</p>`;
}

function copy(b,M,all){
  const I=IND[cur];
  const L=[`【${b.biz}｜${b.dist}｜${I.n}】拍片配對結果`,"","你嘅優勢：",...M.advs.map(a=>`- ${a.adv}`),"","度身 5 條片："];
  all.forEach((t,i)=>L.push(`${i+1}.【${t.f.n}】${t.n}`,`   開頭：${t.hook}`,`   角色：${t.cast}`,`   劇情：${t.plot}`));
  if(b.cust.length)L.push("","針對客人：",...b.cust.map(c=>`- ${CUST[c].n}：${fill(CUST[c].tip,b)}`));
  L.push("",`BP 會員找 JVM 拍：WhatsApp ${JVM.waShow}｜IG ${JVM.ig}`);
  const txt=L.join("\n");
  navigator.clipboard.writeText(txt).then(()=>toast("已複製")).catch(()=>{
    const ta=document.createElement("textarea");ta.value=txt;document.body.appendChild(ta);ta.select();
    try{document.execCommand("copy");toast("已複製")}catch(e){toast("請手動複製")}ta.remove()});
}
function toast(m){const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(t._h);t._h=setTimeout(()=>t.hidden=true,2200)}

render();
</script>
</body>
</html>
