<!doctype html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>拍片題材配對器</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@400;500;700&family=Noto+Serif+HK:wght@700;900&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one column — pick industry (big tiles) → video ideas → JVM offer. Built for business owners reading on a phone. */
:root{
  --bg:#f3f5f7; --paper:#ffffff; --ink:#15202b; --muted:#5d6b78; --line:#d9dfe5;
  --accent:#c8102e; --accent-soft:#fbe7ea; --slate:#1d2b38; --slate-fg:#f3f5f7; --chip:#eaeef2;
  --display:"Noto Serif HK","Songti TC",serif;
  --body:"Noto Sans HK","PingFang HK","Microsoft JhengHei",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f151b; --paper:#172029; --ink:#e7ecf0; --muted:#94a3b0; --line:#2a3743;
  --accent:#ff4d63; --accent-soft:#3a1a20; --slate:#e7ecf0; --slate-fg:#0f151b; --chip:#22303c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f151b; --paper:#172029; --ink:#e7ecf0; --muted:#94a3b0; --line:#2a3743;
  --accent:#ff4d63; --accent-soft:#3a1a20; --slate:#e7ecf0; --slate-fg:#0f151b; --chip:#22303c; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.7}
[hidden]{display:none!important}
.wrap{max-width:860px;margin:0 auto;padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:28px}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.12em;color:var(--muted);display:flex;align-items:center;gap:8px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--accent);display:inline-block;animation:blink 1.6s infinite}
@keyframes blink{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.dot{animation:none}}
h1{font-family:var(--display);font-weight:900;font-size:clamp(30px,6vw,46px);line-height:1.15;margin:6px 0 8px;text-wrap:balance}
h2{font-family:var(--display);font-size:clamp(20px,3.6vw,26px);margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:0;max-width:56ch}
.step{font-family:var(--mono);font-size:12px;color:var(--accent);font-weight:700;letter-spacing:.08em}
.head{display:flex;flex-direction:column;gap:4px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.tiles button{font:inherit;font-weight:700;font-size:15px;text-align:left;background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:12px;cursor:pointer;min-height:52px;line-height:1.35}
.tiles button[aria-pressed="true"]{background:var(--slate);color:var(--slate-fg);border-color:var(--slate)}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.namebox{display:flex;flex-direction:column;gap:6px;max-width:420px}
.namebox label{font-size:14px;font-weight:700}
input[type=text]{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:22px;display:flex;flex-direction:column;gap:16px;min-width:0}
.why{background:var(--slate);color:var(--slate-fg);border-radius:10px;padding:16px 18px;font-weight:700;font-size:17px}
.why small{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.1em;opacity:.7;font-weight:500}
.ideas{display:flex;flex-direction:column;gap:12px}
.idea{border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:8px}
.idea .top{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 12px}
.idea .no{font-family:var(--mono);font-weight:700;color:var(--accent)}
.idea .name{font-weight:700;font-size:18px}
.tag{font-family:var(--mono);font-size:12px;background:var(--chip);border-radius:4px;padding:2px 6px}
.hook{border-left:3px solid var(--accent);padding-left:12px;font-size:16px}
.hook b{display:block;font-size:12px;color:var(--muted);font-weight:500}
details{font-size:15px}
summary{cursor:pointer;color:var(--muted);font-size:14px}
details ol{margin:6px 0 0;padding-left:20px}
.more{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.more div{background:var(--bg);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:2px;font-size:14px}
.more b{font-size:15px}
.muted{color:var(--muted)}
.note{font-size:14px;color:var(--muted);margin:0}
.warn{background:var(--accent-soft);border-radius:8px;padding:12px 16px;font-size:15px}
.warn ul{margin:4px 0 0;padding-left:20px}
.jvm{background:var(--slate);color:var(--slate-fg);border-color:var(--slate)}
.jvm .muted,.jvm .note{color:inherit;opacity:.75}
.offers{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.offer{background:var(--paper);color:var(--ink);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.offer .oname{font-weight:700;font-size:17px}
.price{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.price b{font-family:var(--mono);font-size:28px;color:var(--accent)}
.price s{color:var(--muted);font-size:14px}
.offer ul{margin:0;padding-left:20px;font-size:15px}
.offer .terms{font-size:13px;color:var(--muted);margin:0}
.contact{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{font:inherit;font-weight:700;border:0;border-radius:8px;padding:12px 18px;cursor:pointer;background:var(--accent);color:#fff;text-decoration:none;display:inline-block}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.jvm .btn.ghost{color:inherit;border-color:currentColor}
.sel{user-select:all;font-family:var(--mono);font-size:14px;border:1px solid currentColor;border-radius:8px;padding:10px 12px;overflow-wrap:anywhere;opacity:.9}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--slate);color:var(--slate-fg);padding:10px 16px;border-radius:8px;font-size:14px}
footer{color:var(--muted);font-size:12px;font-family:var(--mono);line-height:1.8}
</style>
</head>
<body>
<div class="wrap">
  <header class="head">
    <div class="eyebrow"><span class="dot" aria-hidden="true"></span>JVM 內容行銷 · 商會會員版</div>
    <h1>你嘅行業，應該拍乜片？</h1>
    <p class="sub">揀你嘅行業，即刻睇到最適合你嘅拍片題材。拍攝同剪輯交俾 JVM 就得。</p>
  </header>

  <section class="head" style="gap:12px">
    <span class="step">第 1 步</span>
    <h2>揀你嘅行業</h2>
    <div class="tiles" id="tiles" role="group" aria-label="行業"></div>
    <div class="namebox">
      <label for="biz">公司名稱（可以唔填）</label>
      <input type="text" id="biz" placeholder="例如：陳記茶餐廳">
    </div>
  </section>

  <section class="panel" id="result" aria-live="polite"></section>

  <section class="panel jvm" id="jvm"></section>

  <footer>由 JVM 內容行銷提供｜WhatsApp 9634 7605｜Justvibingmedia8@gmail.com｜IG @justvibing_media<br>題材按一般行業做法整理，唔代表保證成效。</footer>
</div>
<div class="toast" id="toast" hidden></div>

const $=s=>document.querySelector(s);

$("#tiles").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;cur=b.dataset.k;

  $("#result").scrollIntoView({behavior:matchMedia("(prefers-reduced-motion:reduce)").matches?"auto":"smooth",block:"start"})});

    <div><button class="btn ghost" type="button" id="copy">複製題材，WhatsApp 俾自己</button></div>`;
  $("#copy").onclick=copy;
  renderJVM();
}

function offer(o){return`<div class="offer">

  ${o.terms?`<p class="terms">${o.terms}</p>`:""}
</div>`}

function copy(){
  const I=IND[cur],biz=$("#biz").value.trim();
  const L=[`【${biz||I.n}｜拍片題材】`,"",`重點：${I.pain}`,""];
  I.formats.forEach((f,i)=>{L.push(`${i+1}. ${f.n}（${f.len}）`,`   開頭：${f.hook}`)});
  L.push("","之後可以輪住拍：",...I.pillars.map(p=>`- ${p[0]}`),"",`想 JVM 幫你拍：WhatsApp ${JVM.waShow}｜IG ${JVM.ig}`);
  const txt=L.join("\n");
  navigator.clipboard.writeText(txt).then(()=>toast("已複製")).catch(()=>{
    const ta=document.createElement("textarea");ta.value=txt;document.body.appendChild(ta);ta.select();
    try{document.execCommand("copy");toast("已複製")}catch(e){toast("請手動複製")}ta.remove()});
}
function toast(m){const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(t._h);t._h=setTimeout(()=>t.hidden=true,2200)}

render();
